version: '3.9'

services:
  db:
    image: postgres:15
    restart: always
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env.db

  app:
    build: .
    restart: always
    depends_on:
      - db
    ports:
      - '3000:3000'
    env_file:
      - .env

volumes:
  pgdata:
